<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>proxylibrary — decoyproxy</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="galaxy"></canvas>
    <header id="hud">
      <h1>proxylibrary</h1>
      <button type="button" id="new-node" title="Write a new note (or double-click empty space)">+ New</button>
      <nav id="export">
        <button type="button" id="export-json" title="Download the nodes and edges you can currently see">Export JSON</button>
        <button type="button" id="capture-png" title="Save the galaxy as it looks right now">Capture</button>
        <button type="button" id="open-trash" title="Deleted nodes, still on disk">Trash</button>
      </nav>
      <nav id="views">
        <button data-view="semantic" class="active">Semantic</button>
        <button data-view="ontological">Ontological</button>
        <button data-view="temporal">Temporal</button>
      </nav>
      <form id="search" autocomplete="off">
        <input name="q" placeholder="Search by meaning" aria-label="Search" />
        <label class="only"><input type="checkbox" name="only" /> results only</label>
      </form>
      <nav id="presets" aria-label="Saved views"></nav>
      <nav id="types"></nav>
      <nav id="domains"></nav>
      <nav id="relations" aria-label="Relations"></nav>
      <nav id="tags" aria-label="Tags"></nav>
      <ul id="results" hidden></ul>
      <div id="timeline" hidden>
        <button type="button" id="play" aria-label="Play the timeline">Play</button>
        <input type="range" id="scrub" aria-label="Collected up to" />
        <output id="when"></output>
      </div>
    </header>
    <aside id="inspector" hidden></aside>
    <form id="composer" hidden>
      <h2>New note</h2>
      <label>type <select name="type"></select></label>
      <label>title <input name="title" required maxlength="200" /></label>
      <label>tags <input name="tags" list="all-tags" placeholder="comma, separated" /></label>
      <label>note <textarea name="body" rows="5" placeholder="[[links]] to other notes work here"></textarea></label>
      <p class="hint">Where it lands is decided by what it says, like every other node.</p>
      <div class="actions">
        <button type="button" class="cancel">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
    <div id="busy" hidden role="alertdialog" aria-live="assertive" aria-label="Working">
      <div class="card">
        <p class="what"></p>
        <div class="bar"><span></span></div>
        <p class="hint">Re-reading the library. The galaxy is locked until it is consistent again.<span class="elapsed"></span></p>
      </div>
    </div>
    <div id="bulk" hidden aria-label="Selected nodes">
      <span class="count"></span>
      <input class="tag" list="all-tags" placeholder="tag to add or remove" aria-label="Tag" />
      <button type="button" class="add">Add</button>
      <button type="button" class="remove">Remove</button>
      <select class="domain" aria-label="Set domain"><option value="">set domain…</option></select>
      <button type="button" class="trash">Delete</button>
      <button type="button" class="clear">Clear</button>
    </div>
    <section id="trash" hidden aria-label="Trash">
      <header><h2>Trash</h2><button type="button" class="close" aria-label="Close">×</button></header>
      <ul></ul>
      <footer>
        <p class="hint">Files live in backend/data/.trash until you empty it.</p>
        <button type="button" class="empty">Empty trash</button>
      </footer>
    </section>
    <datalist id="all-tags"></datalist>
    <datalist id="all-nodes"></datalist>
    <p id="status">loading…</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
